name: Build CLIProxyAPI ARMv7

on:
  schedule:
    - cron: "3 20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dddddf5896sts/lyrebird-armv7-build/cliproxy-armv7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLIProxyAPI
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: main
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download management panel (bundle at build time)
        run: |
          set -euo pipefail
          mkdir -p static
          curl -fsSL -o static/management.html \
            "https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/latest/download/management.html"
          ls -la static/management.html

      - name: Cross-compile ARMv7 binary
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -trimpath -ldflags="-s -w" -o dist/CLIProxyAPI ./cmd/server/

      - name: Write container Dockerfile
        run: |
          cat > Dockerfile.armv7 <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates tzdata \
            && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p /CLIProxyAPI/static
          COPY dist/CLIProxyAPI /CLIProxyAPI/CLIProxyAPI
          COPY config.example.yaml /CLIProxyAPI/config.example.yaml
          COPY static/management.html /CLIProxyAPI/static/management.html
          WORKDIR /CLIProxyAPI
          ENV TZ=Asia/Shanghai
          ENV MANAGEMENT_STATIC_PATH=/CLIProxyAPI/static/management.html
          EXPOSE 8317
          CMD ["./CLIProxyAPI"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.armv7
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
