name: Build Lyrebird ARMv7

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lyrebird-armv7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LYREBIRD_VERSION: 0.8.1
  LYREBIRD_COMMIT: 44c34e6535fdece76c7214b805eef2a3d1c01f91
  LYREBIRD_SHA256: 4f0bba81999b894b69d90b09efe9a712014d67345616720da338f8e8c97db19f
  GO_VERSION: "1.22.0"
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download and verify pinned Lyrebird source
        shell: bash
        run: |
          set -euo pipefail
          archive="lyrebird-${LYREBIRD_COMMIT}.tar.gz"
          url="https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird/-/archive/${LYREBIRD_COMMIT}/${archive}"
          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$LYREBIRD_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive"
          mv "lyrebird-${LYREBIRD_COMMIT}" source

      - name: Verify dependencies and run tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test ./...

      - name: Cross-compile Linux ARMv7 binary
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir --parents ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -trimpath -ldflags="-s -w -X main.lyrebirdVersion=v${LYREBIRD_VERSION}" \
            -o ../dist/lyrebird ./cmd/lyrebird

      - name: Verify binary and write checksum
        shell: bash
        run: |
          set -euo pipefail
          file dist/lyrebird | grep --fixed-strings 'ELF 32-bit LSB executable, ARM'
          readelf --file-header dist/lyrebird | grep --fixed-strings 'Class:                             ELF32'
          readelf --file-header dist/lyrebird | grep --fixed-strings 'Machine:                           ARM'
          go version -m dist/lyrebird
          (
            cd dist
            sha256sum lyrebird > SHA256SUMS
          )

      - name: Upload binary and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lyrebird-linux-armv7-v${{ env.LYREBIRD_VERSION }}-${{ env.LYREBIRD_COMMIT }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
